<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXUS UNI // Course Registration</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,600,0,0"
    />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <!-- Bubbles Page Transition Overlay -->
    <div id="bubbles" class="bubbles">
      <div class="bubbles__first"></div>
      <div class="bubbles__second"></div>
    </div>

    <!-- Floating Glassmorphic Navbar -->
    <nav class="nav">
      <div class="nav-brand" onclick="navigateTo('landing')">
        <span class="dot"></span>
        <span>NEXUS<span style="color: var(--accent)">.</span>EDU</span>
      </div>

      <div class="menu" id="nav-links"></div>

      <div class="nav-actions">
        <button class="icon-pill" id="theme-toggle" title="Switch Theme">
          <span class="material-symbols-outlined" style="font-size: 18px">contrast</span>
          <span id="theme-label">Light</span>
        </button>
        <button class="icon-pill hidden" id="logout-btn" onclick="logout()">
          <span class="material-symbols-outlined" style="font-size: 18px">logout</span>
          <span>Logout</span>
        </button>
      </div>
    </nav>

    <!-- Dynamic SPA Root -->
    <main id="app"></main>

    <!-- Course Details Modal -->
    <div id="modal-root" class="modal-backdrop hidden" onclick="closeModal(event)"></div>

    <!-- Notification Toast -->
    <div id="toast" class="toast hidden"></div>

    <!-- Glassmorphic Footer -->
    <footer class="site-footer">
      <div class="top">
        <div>
          <h2 style="font-size: 13px; text-transform: uppercase; color: var(--accent)">Academic Portal</h2>
          <blockquote style="margin: 8px 0 0; font-size: 26px; font-weight: 200;">
            Plan your semester with zero conflicts.
          </blockquote>
        </div>
        <div style="display: flex; gap: 40px; font-size: 14px; color: var(--text-muted)">
          <div>
            <strong style="color: var(--text-primary); display: block; margin-bottom: 8px">Registrar</strong>
            <div>Fall 2026 Enrollment</div>
            <div>Academic Advising</div>
          </div>
          <div>
            <strong style="color: var(--text-primary); display: block; margin-bottom: 8px">Support</strong>
            <div>Bursar & Holds</div>
            <div>System Status: Online</div>
          </div>
        </div>
      </div>
      <div class="bottom">
        <span>&copy; 2026 NEXUS UNIVERSITY. All rights reserved.</span>
        <span>Telegraf Typography &bull; Dual-Theme Engine</span>
      </div>
    </footer>

    <!-- GSAP + SplitText -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/SplitText.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
